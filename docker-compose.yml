version: "3.9"

services:
  backend:
    build: .
    container_name: gsis-asset-sync-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data

  autosync-worker:
    build: .
    container_name: gsis-asset-sync-worker
    command: ["python", "-m", "backend.workers.autosync_worker"]
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./backend/data:/app/backend/data

